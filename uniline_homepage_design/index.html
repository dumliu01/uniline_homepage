<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNILINE // Digital Product Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;700;800&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              outfit: ['Outfit', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              dark: {
                900: '#050505',
                800: '#0A0A0B',
                700: '#111112',
                600: '#1A1A1C',
              },
              accent: '#3B82F6'
            }
          }
        }
      }
    </script>
    <style>
        body {
            background-color: #050505;
            color: #F8FAFC;
            scroll-behavior: smooth;
            overflow-x: hidden;
        }
        
        .bg-grid {
          background-image: 
            linear-gradient(to right, rgba(255,255,255,0.05) 1px, transparent 1px),
            linear-gradient(to bottom, rgba(255,255,255,0.05) 1px, transparent 1px);
          background-size: 60px 60px;
          mask-image: radial-gradient(circle at var(--mouse-x, 50%) var(--mouse-y, 50%), black 0%, transparent 70%);
          transition: mask-image 0.2s ease-out;
        }

        .bg-noise {
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          opacity: 0.03;
          z-index: 50;
          pointer-events: none;
          background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .glass {
          background: rgba(255, 255, 255, 0.02);
          backdrop-filter: blur(24px);
          border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .text-gradient {
          background: linear-gradient(135deg, #FFFFFF 0%, #3B82F6 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
        }

        /* Black Hole Effect Stylings - 10% Reduced */
        .bh-wrapper {
          position: relative;
          display: flex;
          align-items: center;
          justify-content: center;
          width: 252px; /* 280 * 0.9 */
          height: 252px;
        }

        .bh-core {
          position: relative;
          width: 144px; /* 160 * 0.9 */
          height: 144px;
          border-radius: 50%;
          background: #000;
          z-index: 20;
          overflow: hidden;
          box-shadow: 
            inset 0 0 60px rgba(0,0,0,1), 
            0 0 20px rgba(59, 130, 246, 0.3);
          border: 1px solid rgba(59, 130, 246, 0.25);
        }

        .bh-disk-horizontal {
          position: absolute;
          top: 50%;
          left: 50%;
          width: 810px; /* 900 * 0.9 */
          height: 2px;
          background: linear-gradient(90deg, 
            transparent 0%, 
            rgba(59, 130, 246, 0) 5%, 
            rgba(59, 130, 246, 0.6) 20%, 
            #fff 39%, 
            transparent 40%, 
            transparent 60%, 
            #fff 61%, 
            rgba(59, 130, 246, 0.6) 80%, 
            rgba(59, 130, 246, 0) 95%,
            transparent 100%
          );
          transform: translate(-50%, -50%);
          filter: blur(0.8px);
          z-index: 15; 
          animation: bh-pulse 5s ease-in-out infinite;
        }

        .bh-lens-flare {
          position: absolute;
          top: 50%;
          width: 7px;
          height: 7px;
          background: #fff;
          border-radius: 50%;
          filter: blur(2px);
          box-shadow: 0 0 15px 4px #fff, 0 0 30px 8px #3B82F6;
          z-index: 25;
          animation: bh-glow-pulse 3s ease-in-out infinite;
        }
        .bh-lens-flare.left { left: 50%; transform: translate(-79px, -50%); } /* Adjusted */
        .bh-lens-flare.right { left: 50%; transform: translate(72px, -50%); } /* Adjusted */

        .bh-disk-horizontal-glow {
          position: absolute;
          top: 50%;
          left: 50%;
          width: 855px; /* 950 * 0.9 */
          height: 72px; /* 80 * 0.9 */
          background: radial-gradient(ellipse at center, rgba(59, 130, 246, 0.2) 0%, transparent 80%);
          transform: translate(-50%, -50%);
          filter: blur(20px);
          z-index: 5;
          pointer-events: none;
        }

        .bh-arc-top {
          position: absolute;
          top: 50%;
          left: 50%;
          width: 189px; /* 210 * 0.9 */
          height: 112px; /* 125 * 0.9 */
          border-top: 9px solid rgba(59, 130, 246, 0.6);
          border-radius: 120px 120px 0 0;
          transform: translate(-50%, -95%) scale(1.05);
          filter: blur(10px);
          z-index: 10;
        }

        .bh-arc-bottom {
          position: absolute;
          top: 50%;
          left: 50%;
          width: 171px; /* 190 * 0.9 */
          height: 94px; /* 105 * 0.9 */
          border-bottom: 7px solid rgba(59, 130, 246, 0.4);
          border-radius: 0 0 100px 100px;
          transform: translate(-50%, -5%) scale(1.05);
          filter: blur(12px);
          z-index: 10;
        }

        .bh-ring-inner {
          position: absolute;
          top: 50%;
          left: 50%;
          width: 158px; /* 176 * 0.9 */
          height: 158px;
          border: 1px solid rgba(59, 130, 246, 0.4);
          border-radius: 50%;
          transform: translate(-50%, -50%);
          filter: blur(4px);
          z-index: 12;
        }

        @keyframes bh-pulse {
          0%, 100% { opacity: 0.7; transform: translate(-50%, -50%) scaleX(1); }
          50% { opacity: 1; transform: translate(-50%, -50%) scaleX(1.03); }
        }

        @keyframes bh-glow-pulse {
          0%, 100% { opacity: 0.8; transform: translate(var(--tw-translate-x), -50%) scale(1); }
          50% { opacity: 1; transform: translate(var(--tw-translate-x), -50%) scale(1.3); }
        }

        @keyframes float-particle {
          0% { transform: translateY(0) translateX(0); }
          100% { transform: translateY(-115vh) translateX(30px); }
        }

        .particle {
          position: absolute;
          background: white;
          border-radius: 50%;
          pointer-events: none;
          animation: float-particle linear infinite;
          will-change: transform;
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #050505; }
        ::-webkit-scrollbar-thumb { background: #1E293B; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #3B82F6; }
    </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="selection:bg-accent selection:text-white">
    <div class="bg-noise"></div>
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
