
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNILINE // Digital Product Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;700;800&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              outfit: ['Outfit', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              dark: {
                900: '#050505',
                800: '#0A0A0B',
                700: '#111112',
                600: '#1A1A1C',
              },
              accent: '#3B82F6'
            }
          }
        }
      }
    </script>
    <style>
        body {
            background-color: #050505;
            color: #F8FAFC;
            scroll-behavior: smooth;
            overflow-x: hidden;
        }
        
        /* Interactive Grid */
        .bg-grid {
          background-image: 
            linear-gradient(to right, rgba(255,255,255,0.05) 1px, transparent 1px),
            linear-gradient(to bottom, rgba(255,255,255,0.05) 1px, transparent 1px);
          background-size: 60px 60px;
          /* Mask moves with mouse via CSS Variable */
          mask-image: radial-gradient(circle at var(--mouse-x, 50%) var(--mouse-y, 50%), black 0%, transparent 70%);
          transition: mask-image 0.2s ease-out;
        }

        /* Movie Grain */
        .bg-noise {
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          opacity: 0.03;
          z-index: 50;
          pointer-events: none;
          background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .glass {
          background: rgba(255, 255, 255, 0.02);
          backdrop-filter: blur(24px);
          border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .text-gradient {
          background: linear-gradient(135deg, #FFFFFF 0%, #3B82F6 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
        }

        /* Ambient drifting */
        @keyframes drift {
          0%, 100% { transform: translate(0, 0) scale(1); }
          50% { transform: translate(5vw, 5vh) scale(1.1); }
        }
        @keyframes drift-slow {
          0%, 100% { transform: translate(0, 0) scale(1.1); }
          50% { transform: translate(-3vw, -6vh) scale(0.95); }
        }

        .animate-drift { animation: drift 20s ease-in-out infinite; }
        .animate-drift-slow { animation: drift-slow 25s ease-in-out infinite; }

        @keyframes float-particle {
          0% { transform: translateY(0) translateX(0); opacity: 0; }
          20% { opacity: 0.4; }
          80% { opacity: 0.4; }
          100% { transform: translateY(-100vh) translateX(20px); opacity: 0; }
        }

        /* 爆炸后上升的动画 */
        @keyframes burst-float {
          0% {
            transform: translate(0, 0) scale(0);
            opacity: 1;
          }
          15% {
            transform: translate(var(--tx), var(--ty)) scale(1.2);
            opacity: 1;
          }
          100% {
            transform: translate(calc(var(--tx) * 1.5), calc(var(--ty) - 100vh)) scale(0.5);
            opacity: 0;
          }
        }

        .particle {
          position: absolute;
          background: white;
          border-radius: 50%;
          pointer-events: none;
          animation: float-particle linear infinite;
        }

        .click-particle {
          position: absolute;
          border-radius: 50%;
          pointer-events: none;
          animation: burst-float cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
          will-change: transform, opacity;
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #050505; }
        ::-webkit-scrollbar-thumb { background: #1E293B; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #3B82F6; }
    </style>
<script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.36.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="selection:bg-accent selection:text-white">
    <div class="bg-noise"></div>
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
