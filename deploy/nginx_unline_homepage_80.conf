server {
    listen 80;
    server_name www.uniline.site;

    root /dumsite/uniline_homepage;
    index index.html;

    # SPA fallback: direct access to /xxx should serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets cache
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }
}

