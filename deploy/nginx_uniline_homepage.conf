server {
    listen 80;
    server_name www.uniline.site;

    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.uniline.site;

    # TLS certs (adjust to your actual paths)
    ssl_certificate     /etc/letsencrypt/live/www.uniline.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.uniline.site/privkey.pem;

    # Recommended TLS settings (safe defaults)
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /dumsite/uniline_homepage;
    index index.html;

    # SPA fallback: direct access to /xxx should serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets cache
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }
}

